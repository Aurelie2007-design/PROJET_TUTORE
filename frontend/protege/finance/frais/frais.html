<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FST CAISSE - Configuration des Frais</title>
    <link rel="stylesheet" href="./frais.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-shield-halved"></i>
          <h2>FST CAISSE <span>Administration</span></h2>
        </div>
        <nav class="menu">
          <a href="../dashboard/dashboard.html"
            ><i class="fa-solid fa-chart-pie"></i> Tableau de bord</a
          >
          <a href="../utilisateurs/utilisateurs.html"
            ><i class="fa-solid fa-users"></i> Utilisateurs</a
          >
          <a href="../etudiants/etudiants.html"
            ><i class="fa-solid fa-user-graduate"></i> Étudiants</a
          >
          <a href="#"><i class="fa-solid fa-wallet"></i> Paiements</a>
          <a href="../frais/frais.html" class="active"
            ><i class="fa-solid fa-graduation-cap"></i> Frais académiques</a
          >
          <a href="../rapport/rapport.html"
            ><i class="fa-solid fa-file-invoice-dollar"></i> Rapports</a
          >
        </nav>
        <div class="logout" id="logout">
          <i class="fa-solid fa-power-off"></i> Déconnexion
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="page-title">
            <p>Tableau de bord</p>
            <p class="" id="today">INTERFACE ADMINISTRATEUR</p>
          </div>
          <div class="user-profile">
            <div class="notification"></div>
            <div class="avatar">Admin</div>
            <div class="user-info">
              <h4>Admin FST</h4>
              <span>Administrateur</span>
            </div>
          </div>
        </header>

        <div class="containu">
          <form id="formFrais" class="card">
            <h2>Créer un frais</h2>

            <input type="text" id="nom" placeholder="Nom du frais" required />

            <textarea id="description" placeholder="Description"></textarea>

            <input type="number" id="montant" placeholder="Montant" required />

            <label>Classes concernées :</label>
            <div id="classesList"></div>

            <button type="submit">Créer</button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="./frais.js"></script>
    <script type="module" src="../finance.js"></script>
  </body>
</html>
