<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon profil - Interface Étudiant</title>
    <link rel="stylesheet" href="Mon profil.css" />
    <link rel="stylesheet" href="../etudiant.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>INTERFACE ETUDIANT</h1>
        <div class="profile">
          <p>Etudiant</p>
        </div>
      </header>
      <aside class="sidebar">
        <div class="logo">
          <h2>FSTA CAISSE</h2>
          <p>Espace Etudiant</p>
        </div>
        <nav>
          <ul>
            <li onclick="navigate('dashboard')">Tableau de bord</li>
            <li onclick="navigate('Mes paiements')">Mes paiements</li>
            <li class="active" onclick="navigate('Mon profil')">Mon profil</li>
            <li class="logout" onclick="logout()">Deconnexion</li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>INTERFACE ÉTUDIANT</h1>
          <p class="sub-info">Nom Étudiant<br />Rôle</p>
        </header>

        <section class="profil-section">
          <div class="profil" id="profil">
            <p><strong>Nom complet :</strong> ...</p>
            <p><strong>Matricule :</strong> ...</p>
            <p><strong>Promotion :</strong> ...</p>
            <p><strong>Email :</strong> ...</p>
          </div>
        </section>
      </main>
    </div>
    <script src="../navigation.js"></script>
    <script type="module" src="./monProfil.js"></script>
  </body>
</html>
