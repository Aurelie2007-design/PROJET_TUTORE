<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./paiements.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="">
    <div class="body">
      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-shield-halved"></i>
          <h2>FST CAISSE <span>caisse</span></h2>
        </div>
        <nav class="menu">
          <a href="../tableauDeBord/tableauDeBord.html"
            ><i class="fa-solid fa-chart-pie"></i> Tableau de bord</a
          >
          <a href="../recherche/recherche.html"
            ><i class="fa-solid fa-users"></i> Recherche</a
          >
          <a href="../paiements/paiements.html" class="active"
            ><i class="fa-solid fa-user-graduate"></i> paiements</a
          >
          <a href="../recus/recus.html"
            ><i class="fa-solid fa-wallet"></i> recus</a
          >
          <a href="../profile/profile.html"
            ><i class="fa-solid fa-graduation-cap"></i> Profile</a
          >
          <a href="../rapport/rapport.html"
            ><i class="fa-solid fa-file-invoice-dollar"></i> Rapports</a
          >
        </nav>
        <div class="logout" id="logout">
          <i class="fa-solid fa-power-off"></i> Déconnexion
        </div>
      </aside>
      <main class="container">
        <div class="page">
          <div class="head">
            <div class="left">
              <h2>Page Paiement</h2>
              <p id="today">Samedi 30 Mars 2007</p>
            </div>
            <div class="right">
              <div class="right">
                <button class="changetheme" id="changetheme">
                  Changer le theme
                </button>
              </div>
            </div>
          </div>
          <div class="contenu">
            <div class="etudiant-selectionne">
              <div class="info" id="etudiant">
                <div class="nom" id="name">
                  <img src="../../../public/assets/profile.jpg" alt="" />
                  <p id="student_name"></p>
                </div>
                <div class="content1 header">
                  <div class="left"><p>Frais</p></div>
                  <div class="right">
                    <div><p>Total</p></div>
                    <div><p>Payé</p></div>
                    <div><p>Reste</p></div>
                    <div><p>%</p></div>
                  </div>
                </div>
                <div id="frais_container"></div>
              </div>
              <div class="changer">
                <button id="changer_etudiant">Changer d'etudiant</button>
                <button id="start_recu">Nouveau reçu</button>
                <button id="finish_recu">Terminer et voir reçu</button>
              </div>
            </div>
            <div class="payer" id="parent">
              <div class="boite">
                <h2>Details de paiement</h2>
                <p>Type de paiement</p>
                <select id="select"></select>
                <div class="montant">
                  <div class="left">
                    <p>Entrer le montant</p>
                    <input type="number" id="montant" placeholder="Montant" />
                  </div>
                  <div class="right">
                    <p>Monnaie</p>
                    <select>
                      <option value="USD">USD</option>
                      <option value="FC">FC</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="valider">
                <button id="payer" class="pay">Valider le paiement</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../caisse.js"></script>
    <script type="module" src="./paiements.js"></script>
  </body>
</html>
